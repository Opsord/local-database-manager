version: 2

project_name: db-manager

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: db-manager
    main: ./cmd/db-manager
    binary: db-manager
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: default
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE
      - config.yml
      - engines/**/*
      - instances/.env.template
      - scripts/**/*

checksum:
  name_template: "checksums.txt"

release:
  prerelease: auto

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
