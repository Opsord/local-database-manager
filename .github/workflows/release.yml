name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Verify tag branch policy
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          git fetch origin main dev
          if [[ "$TAG_NAME" == *-* ]]; then
            if ! git merge-base --is-ancestor "${{ github.sha }}" origin/dev && \
               ! git merge-base --is-ancestor "${{ github.sha }}" origin/main; then
              echo "Error: Pre-release tags ($TAG_NAME) must point to a commit on dev or main."
              exit 1
            fi
          else
            if ! git merge-base --is-ancestor "${{ github.sha }}" origin/main; then
              echo "Error: Stable release tags ($TAG_NAME) must point to a commit on main."
              exit 1
            fi
          fi

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
