name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Verify tag branch policy
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          git fetch origin main dev
          if [[ "$TAG_NAME" == *-* ]]; then
            if ! git merge-base --is-ancestor "${{ github.sha }}" origin/dev && \
               ! git merge-base --is-ancestor "${{ github.sha }}" origin/main; then
              echo "Error: Pre-release tags ($TAG_NAME) must point to a commit on dev or main."
              exit 1
            fi
          else
            if ! git merge-base --is-ancestor "${{ github.sha }}" origin/main; then
              echo "Error: Stable release tags ($TAG_NAME) must point to a commit on main."
              exit 1
            fi
          fi

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}

  release-desktop:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: Windows_x86_64
            goos: windows
            ext: zip
          - os: ubuntu-latest
            target: Linux_x86_64
            goos: linux
            ext: tar.gz
          - os: macos-latest
            target: Darwin_arm64
            goos: darwin
            ext: zip
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build desktop frontend
        run: |
          pnpm --dir frontend install --frozen-lockfile
          pnpm --dir frontend run build

      - name: Install Linux WebKit dependencies
        if: matrix.goos == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Build and package Windows desktop archive
        if: matrix.goos == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-desktop/instances | Out-Null
          $tag = "${{ github.ref_name }}"
          $shortCommit = "${{ github.sha }}".Substring(0, 7)
          $buildDate = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          $ldflagsDesktop = "-s -w -H windowsgui -X github.com/Opsord/local-database-manager/internal/version.Version=$tag -X github.com/Opsord/local-database-manager/internal/version.Commit=$shortCommit -X github.com/Opsord/local-database-manager/internal/version.Date=$buildDate"
          go build -tags "desktop,production" -ldflags $ldflagsDesktop -o dist-desktop/db-manager-desktop.exe ./cmd/db-manager-desktop
          Copy-Item README.md, LICENSE, config.yml dist-desktop/
          Copy-Item -Recurse engines dist-desktop/engines
          Copy-Item instances/.env.template dist-desktop/instances/.env.template
          $archive = "db-manager-desktop_${{ matrix.target }}.zip"
          Compress-Archive -Path dist-desktop/* -DestinationPath $archive -Force
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLower()
          "$hash  $archive" | Out-File -Encoding ascii "$archive.sha256"

      - name: Build Windows installer (Inno Setup)
        if: matrix.goos == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path dist-installer | Out-Null

          $tag = "${{ github.ref_name }}"
          $shortCommit = "${{ github.sha }}".Substring(0, 7)
          $buildDate = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          $ldflagsCli = "-s -w -X github.com/Opsord/local-database-manager/internal/version.Version=$tag -X github.com/Opsord/local-database-manager/internal/version.Commit=$shortCommit -X github.com/Opsord/local-database-manager/internal/version.Date=$buildDate"

          $env:CGO_ENABLED = "0"
          go build -ldflags $ldflagsCli -o dist-installer/db-manager.exe ./cmd/db-manager
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          Copy-Item dist-desktop/db-manager-desktop.exe, README.md, LICENSE dist-installer/

          $iscc = $null
          $isccCmd = Get-Command iscc -ErrorAction SilentlyContinue
          if ($isccCmd) {
            $iscc = $isccCmd.Source
          }
          if (-not $iscc) {
            foreach ($candidate in @(
              "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
              "C:\Program Files\Inno Setup 6\ISCC.exe"
            )) {
              if (Test-Path $candidate) {
                $iscc = $candidate
                break
              }
            }
          }
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path $iscc)) {
            throw "Inno Setup compiler (ISCC.exe) not found."
          }

          $numericVersion = "0.0.0.0"
          if ($tag -match '^v?(\d+\.\d+\.\d+)') {
            $numericVersion = "$($Matches[1]).0"
          }

          $sourceDir = (Resolve-Path "dist-installer").Path
          $outputDir = (Get-Location).Path
          $setupName = "db-manager_Windows_x86_64-setup"

          & $iscc `
            "/DAppVersion=$tag" `
            "/DNumericVersion=$numericVersion" `
            "/DSourceDir=$sourceDir" `
            "/DOutputDir=$outputDir" `
            "/DOutputBaseFilename=$setupName" `
            "build\windows\installer.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $setupExe = "$setupName.exe"
          $hash = (Get-FileHash $setupExe -Algorithm SHA256).Hash.ToLower()
          "$hash  $setupExe" | Out-File -Encoding ascii "$setupExe.sha256"

      - name: Build and package Linux desktop archive
        if: matrix.goos == 'linux'
        shell: bash
        run: |
          mkdir -p dist-desktop/instances
          go build -tags "desktop,production,webkit2_41" -ldflags "-s -w -X github.com/Opsord/local-database-manager/internal/version.Version=${{ github.ref_name }}" -o dist-desktop/db-manager-desktop ./cmd/db-manager-desktop
          cp README.md LICENSE config.yml dist-desktop/
          cp -r engines dist-desktop/engines
          cp instances/.env.template dist-desktop/instances/.env.template
          ARCHIVE="db-manager-desktop_${{ matrix.target }}.tar.gz"
          tar -czf "$ARCHIVE" -C dist-desktop .
          sha256sum "$ARCHIVE" > "${ARCHIVE}.sha256"

      - name: Build and package macOS desktop archive
        if: matrix.goos == 'darwin'
        shell: bash
        run: |
          mkdir -p dist-desktop/instances
          mkdir -p dist-desktop/db-manager-desktop.app/Contents/MacOS
          CGO_ENABLED=1 CGO_LDFLAGS="-framework UniformTypeIdentifiers" GOOS=darwin GOARCH=arm64 go build -tags "desktop,production" -ldflags "-s -w -X github.com/Opsord/local-database-manager/internal/version.Version=${{ github.ref_name }}" -o dist-desktop/db-manager-desktop.app/Contents/MacOS/db-manager-desktop ./cmd/db-manager-desktop
          cat << 'EOF' > dist-desktop/db-manager-desktop.app/Contents/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key>
            <string>db-manager-desktop</string>
            <key>CFBundleIdentifier</key>
            <string>io.github.opsord.dbmanager</string>
            <key>CFBundleName</key>
            <string>Local Database Manager</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>${{ github.ref_name }}</string>
            <key>NSHighResolutionCapable</key>
            <true/>
          </dict>
          </plist>
          EOF
          cp README.md LICENSE config.yml dist-desktop/
          cp -r engines dist-desktop/engines
          cp instances/.env.template dist-desktop/instances/.env.template
          ARCHIVE="db-manager-desktop_${{ matrix.target }}.zip"
          (cd dist-desktop && zip -r "../$ARCHIVE" .)
          shasum -a 256 "$ARCHIVE" > "${ARCHIVE}.sha256"

      - name: Upload Windows artifacts to GitHub Release
        if: matrix.goos == 'windows'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release upload "${{ github.ref_name }}"
          "db-manager-desktop_${{ matrix.target }}.${{ matrix.ext }}"
          "db-manager-desktop_${{ matrix.target }}.${{ matrix.ext }}.sha256"
          "db-manager_Windows_x86_64-setup.exe"
          "db-manager_Windows_x86_64-setup.exe.sha256"
          --clobber

      - name: Upload desktop artifacts to GitHub Release
        if: matrix.goos != 'windows'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" "db-manager-desktop_${{ matrix.target }}.${{ matrix.ext }}" "db-manager-desktop_${{ matrix.target }}.${{ matrix.ext }}.sha256" --clobber
